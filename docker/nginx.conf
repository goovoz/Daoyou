# [daoyou-fork] 前端静态站 + API 反代
# 与 API 同源：前端请求 /api 相对路径，这里转给 app 容器。
# /internal/*（定时任务）刻意不对外代理 —— 让宿主机 cron 直接打 127.0.0.1:3000。

# WebSocket 升级头：无 Upgrade 时自动回落到 close，避免连接悬挂
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream daoyou_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # 带内容哈希的产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html / 版本清单 / Service Worker 必须每次回源，否则发版后客户端拿旧壳
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # API 与实时通道
    location /api/ {
        proxy_pass http://daoyou_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 实时广播与 LLM 流式响应都可能长时间挂起
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
