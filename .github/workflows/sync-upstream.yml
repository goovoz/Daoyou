# [daoyou-fork] 每日同步上游
#
# 策略说明：本仓用「merge 上游」而不是 rebase 重放补丁。
# 原因：master 是公开分支且已被 clone，rebase 会改写公共历史、必须 force push。
# 代价：每次同步多一个 merge 提交；补丁仍可通过 commit message 里的 Fork-Patch trailer 识别。
name: Sync upstream

on:
  schedule:
    # 每天 4 次（UTC 01/07/13/19，即北京时间 09/15/21/03）。
    # 单一日频不够用：GitHub 的定时任务会延迟数小时（实测 03:17 被延到 08:34），
    # 上游若在这之后推提交，就要等到第二天才可能被捡到。
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = 通过检查就直推（定时同款）；report = 只扫描；pr = 只开 PR；direct = 不看补丁风险直推'
        type: choice
        options: [auto, report, pr, direct]
        default: auto

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取上游
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ChurchTao/Daoyou.git
          git fetch --no-tags --prune upstream master
          UP_SHA=$(git rev-parse FETCH_HEAD)
          OLD_SHA=$(git rev-parse origin/upstream-dev 2>/dev/null || echo none)
          echo "upstream $OLD_SHA -> $UP_SHA"
          echo "sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          # 记下 fork 自身提交：后续步骤要用它从 git 对象里读 fork 独有文件，
          # 不能依赖工作区（工作区可能已被切到上游树）。
          echo "fork_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$UP_SHA" = "$OLD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新 upstream-dev 镜像
        if: steps.fetch.outputs.changed == 'true' && inputs.mode != 'report'
        run: |
          set -euo pipefail
          # 只推引用，不 checkout。
          # 曾经的写法 `git checkout -B upstream-dev <sha>` 会把工作区切成上游的树，
          # 而 .github/fork-patches.json、.github/scripts/* 是 fork 独有文件，
          # 于是紧随其后的「风险扫描」必崩：Cannot find module './.github/fork-patches.json'。
          # 而且这恰好只在「上游真的有新提交」时触发，等于同步永远走不到合并那一步。
          git push origin "${{ steps.fetch.outputs.sha }}:refs/heads/upstream-dev" --force

      - name: 接口面扫描（上游旧版 vs 新版）
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -uo pipefail
          mkdir -p /tmp/old /tmp/new
          OLD_REF=origin/upstream-dev
          git rev-parse "$OLD_REF" >/dev/null 2>&1 || OLD_REF="${{ steps.fetch.outputs.sha }}^"
          git archive "$OLD_REF" | tar -x -C /tmp/old
          git archive "${{ steps.fetch.outputs.sha }}" | tar -x -C /tmp/new
          # 扫描脚本是 fork 独有文件，从 git 对象取出再跑。
          # 注意不能用 `|| true` 掩盖：脚本缺失会导致两侧输出都为空，
          # 于是 diff 判定「无变化」，把真实缺口藏起来。
          git show "${{ steps.fetch.outputs.fork_sha }}:.github/scripts/scan-interface-surface.sh" > /tmp/scan-surface.sh
          bash /tmp/scan-surface.sh /tmp/old > /tmp/scan-old.txt 2>&1 || true
          bash /tmp/scan-surface.sh /tmp/new > /tmp/scan-new.txt 2>&1 || true
          if [ ! -s /tmp/scan-old.txt ] && [ ! -s /tmp/scan-new.txt ]; then
            echo "接口面扫描无输出，脚本可能执行失败：" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -20 /tmp/scan-new.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## 接口面变化" >> "$GITHUB_STEP_SUMMARY"
          if diff -u /tmp/scan-old.txt /tmp/scan-new.txt > /tmp/scan.diff; then
            echo "无变化。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            head -120 /tmp/scan.diff >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 风险扫描
        id: risk
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -uo pipefail
          FORK_SHA="${{ steps.fetch.outputs.fork_sha }}"
          # 从 git 对象读取，不依赖工作区里是否存在该文件
          TOUCHES=$(git show "$FORK_SHA:.github/fork-patches.json" | node -e "
            let s='';
            process.stdin.on('data', d => s += d).on('end', () => {
              const m = JSON.parse(s);
              console.log(m.patches.flatMap(p => p.touches).join('\n'));
            });
          ")
          CHANGED=$(git diff --name-only origin/upstream-dev "${{ steps.fetch.outputs.sha }}" 2>/dev/null || \
                    git diff --name-only "${{ steps.fetch.outputs.sha }}^" "${{ steps.fetch.outputs.sha }}")
          HIT=$(comm -12 <(printf '%s\n' "$TOUCHES" | sort -u) <(printf '%s\n' "$CHANGED" | sort -u) || true)
          printf '%s\n' "$HIT" > /tmp/hit.txt
          echo "## 风险扫描" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$HIT" ]; then
            echo "以下补丁触碰的文件被上游改动，需人工复核：" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$HIT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "补丁触碰文件未被上游改动。" >> "$GITHUB_STEP_SUMMARY"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -qx 'LICENSE'; then
            echo "⚠️ LICENSE 被改动，禁止静默覆盖。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 探测上游是否已实现 GM 面板
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -uo pipefail
          mkdir -p /tmp/probe
          git archive "${{ steps.fetch.outputs.sha }}" | tar -x -C /tmp/probe
          # 探测器脚本同样是 fork 独有文件，从 git 对象取出，避免工作区被切换后找不到
          git show "${{ steps.fetch.outputs.fork_sha }}:.github/scripts/detect-gm-panel.sh" > /tmp/detect-gm-panel.sh
          RESULT=$(bash /tmp/detect-gm-panel.sh /tmp/probe || true)
          echo "## 补丁存活探测（gm-panel）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 合并到同步分支
        id: merge
        if: steps.fetch.outputs.changed == 'true' && inputs.mode != 'report'
        run: |
          set -uo pipefail
          # 固定分支名，不再按日期生成。
          # 日期分支每次同步都新建一个，用完没人删，两个月就堆出几十个（2026-10-26 清理了 3 个）。
          # 固定名还有个好处：PR 开着时再同步，force-push 会直接更新同一个 PR，不会开新 PR。
          BRANCH="sync/upstream"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/master
          if git merge --no-edit "${{ steps.fetch.outputs.sha }}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # 不硬来：把冲突标记原样提交，交人处理
            git add -A
            git commit -m "chore(sync): 上游 ${{ steps.fetch.outputs.sha }} 合并产生冲突（需人工）" || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          # 这个分支只由本 workflow 写，用 --force 而不是 --force-with-lease：
          # 固定名 + CI 独占，lease 反而会因本地引用过期而失败。
          git push origin "$BRANCH" --force
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: 准备 Node（与镜像一致）
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-node@v4
        with:
          # docker/Dockerfile.app 用 node:24.18.0；runner 默认版本可能更旧，
          # 固定成同一个版本，避免「本地过、CI 不过」这类环境差异。
          node-version: '24.18.0'

      - name: 缓存 pnpm store
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: 类型检查（合并结果）
        id: typecheck
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -uo pipefail
          # 与 docker/Dockerfile.app 用同一个 pnpm 版本，避免解释器差异
          npm install --global pnpm@12.10.1 >/dev/null 2>&1 || true
          if pnpm install --frozen-lockfile >/tmp/install.log 2>&1 \
             && pnpm run typecheck >/tmp/tc.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "类型检查通过。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::合并结果类型检查未通过，改为开 PR 交人工处理"
            {
              echo "⚠️ 类型检查未通过，改为开 PR。"
              echo '```'
              tail -30 /tmp/tc.log 2>/dev/null || tail -30 /tmp/install.log 2>/dev/null || echo "(无输出)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 判定落库方式
        id: policy
        if: steps.merge.outputs.branch != ''
        run: |
          set -uo pipefail
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE=auto
          CONFLICT="${{ steps.merge.outputs.conflict }}"
          TC="${{ steps.typecheck.outputs.ok }}"
          RISK="${{ steps.risk.outputs.hit }}"

          # 上游碰过的补丁文件里，锚点必须还在。
          # 之所以不再「碰到就拦」：schema.ts 这类追加式改动 git 能自动合并，
          # 按文件粒度拦截会让三分之一的上游批次都变成 PR，等于永远落后。
          # 现在改为校验实际记号，丢了才算补丁被覆盖。
          MISSING=""
          if [ "$RISK" = "true" ] && [ -s /tmp/hit.txt ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if [ ! -f "$f" ]; then MISSING="$MISSING $f(已删除)"
              elif ! grep -q 'daoyou-fork' "$f"; then MISSING="$MISSING $f"; fi
            done < /tmp/hit.txt
          fi
          [ -n "$MISSING" ] && echo "锚点丢失：$MISSING" >> "$GITHUB_STEP_SUMMARY"

          PUSH=false
          if [ "$CONFLICT" != "true" ] && [ "$TC" = "true" ]; then
            case "$MODE" in
              # 人工 direct：只要不冲突、类型检查过就直推
              direct) PUSH=true ;;
              # 定时（auto）：补丁锚点必须完整
              auto) [ -z "$MISSING" ] && PUSH=true ;;
              *) PUSH=false ;;
            esac
          fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          {
            echo "## 落库判定"
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| mode | $MODE |"
            echo "| 合并冲突 | $CONFLICT |"
            echo "| 类型检查 | $TC |"
            echo "| 上游碰过补丁文件 | $RISK |"
            echo "| 锚点丢失 | ${MISSING:-无} |"
            echo "| 直推 master | $PUSH |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 直接推送 master
        if: steps.policy.outputs.push == 'true'
        run: |
          set -euo pipefail
          git checkout master
          git merge --ff-only "${{ steps.merge.outputs.branch }}" 2>/dev/null || git merge --no-edit "${{ steps.merge.outputs.branch }}"
          git push origin master

      - name: 触发镜像重建
        if: steps.policy.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 用 GITHUB_TOKEN 推的 commit 不会触发 on: push 的 workflow，
          # 所以同步合并后镜像不会自动更新，必须显式 dispatch 一次。
          # 必须带 --repo：本 workflow 前面用 `git remote add upstream` 加了上游仓库，
          # gh 会自动识别成 ChurchTao/Daoyou，导致 404 workflow not found。
          if OUT=$(gh workflow run docker-publish.yml --ref master --repo "${{ github.repository }}" 2>&1); then
            echo "已触发 docker-publish。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::触发 docker-publish 失败：$OUT"
            {
              echo "⚠️ 触发镜像重建失败，请手动 dispatch docker-publish，否则 latest 仍是旧代码。"
              echo '```'
              echo "$OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 开 PR
        if: steps.merge.outputs.branch != '' && steps.policy.outputs.push != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="chore(sync): 同步上游 ${{ steps.fetch.outputs.sha }}"
          REASON=""
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            REASON="存在冲突"
          elif [ "${{ steps.typecheck.outputs.ok }}" != "true" ]; then
            REASON="类型检查未通过"
          elif [ -n "${{ steps.policy.outputs.missing }}" ]; then
            REASON="补丁锚点丢失"
          fi
          if [ -n "$REASON" ]; then
            TITLE="[需人工] $TITLE（$REASON）"
          fi
          REPO="${{ github.repository }}"
          BRANCH="${{ steps.merge.outputs.branch }}"
          # gh 会按 git remote 推断仓库，本 workflow 加过 upstream remote，
          # 不显式 --repo 会指到上游仓库（曾报 404 workflow not found）。
          if gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "该分支已有未合并 PR，跳过创建。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr create --repo "$REPO" --base master --head "$BRANCH" \
            --title "$TITLE" --body "自动同步，详见 job summary 的接口面扫描、风险扫描与类型检查结果。"; then
            echo "已创建 PR：$TITLE" >> "$GITHUB_STEP_SUMMARY"
          else
            # 以前这里是 `|| echo`，导致「合并被拦下但没人知道」。现在显式失败。
            echo "::error::PR 创建失败。请确认仓库已开启 Settings → Actions → Allow GitHub Actions to create and approve pull requests，或手动处理分支 $BRANCH"
            exit 1
          fi
